name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main, ios ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lock Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen (pinned 2.42.0)
        run: |
          set -euo pipefail
          # 纪律：禁止 brew install xcodegen —— brew 最新版(>=2.44.1)生成
          # objectVersion 77（Xcode 26 工程格式），被锁定的 Xcode 15.4 拒读：
          # "future Xcode project file format (77)"（首跑 CI 实测踩坑）。
          # 故钉住 2.42.0：Xcode 15 同代版本，输出旧格式。升级 Xcode 前不得解钉。
          curl -sL --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip" \
            -o /tmp/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo mkdir -p /usr/local/bin /usr/local/share
          sudo cp /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo cp -R /tmp/xcodegen/xcodegen/share/xcodegen /usr/local/share/
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # 纪律：本段禁止用 head 提前关闭管道。
          # head 读满一行即退出并关闭管道，上游会收到 SIGPIPE(141)，
          # 在 `set -o pipefail` 下整条管道被判失败、step 直接挂掉。
          # 改用 `grep -m1`：由 grep 自己在首个匹配处停止，不产生 SIGPIPE。
          DEVICE=$(xcrun simctl list devices available \
            | grep -Eom1 'iPhone [0-9]+( Pro Max| Pro| Plus| mini)?' \
            | sed -E 's/[[:space:]]+$//' || true)
          if [ -z "$DEVICE" ]; then
            echo "::error::runner 上找不到任何可用 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE"

      - name: Run unit tests (simulator)
        run: |
          set -euo pipefail
          mkdir -p build
          # 输出同时落盘（pipefail 保证 xcodebuild 的失败码能传出），供下一步抽取注解。
          xcodebuild test \
            -project ZhishengWeather.xcodeproj \
            -scheme ZhishengWeather \
            -destination "platform=iOS Simulator,OS=latest,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild-test.log

      # 为什么需要这一步：作业日志（/actions/jobs/{id}/logs）与产物下载都要求
      # 管理员权限，Windows 侧免鉴权拿不到 → CI 一红就只能靠读代码盲猜。
      # `::error::` 注解会写进 check run 的 output.annotations，而 check-runs
      # 接口对公开仓库免鉴权可读 —— 于是「红在哪一行」变成可观测事实。
      - name: Report test failures as annotations
        if: failure()
        run: |
          set -euo pipefail
          LOG=build/xcodebuild-test.log
          if [ ! -f "$LOG" ]; then
            echo "::warning::未找到 xcodebuild 日志，无法抽取失败原因"
            exit 0
          fi
          # 抽取编译错误与失败断言；每行一条注解（% 需转义为 %25）。
          #
          # ⚠️ 截断**必须**用 `awk 'NR<=40'`，**不能**用 `head -40`：
          # 本 step 在 `set -o pipefail` 下运行，而 `head` 读满 40 行就关闭管道，
          # 上游 `grep`/`sed` 随即收到 SIGPIPE、以 141 退出，pipefail 会把整条管道
          # 判为失败 → **这个"报告失败"的步骤自己失败**，反而掩盖真正的测试失败。
          # `awk 'NR<=40'` 会把输入读完、只打印前 40 行，因此不产生 SIGPIPE。
          # 日志短时侥幸能过、日志一长就崩，是这类缺陷最典型的表现（QA 静态检查 SC-23）。
          grep -aE "error:|XCTAssert[A-Za-z]* failed|failed - |TEST FAILED" "$LOG" \
            | sed -e 's/\r$//' \
            | awk 'NR<=40' \
            | while IFS= read -r line; do
                escaped=$(printf '%s' "$line" | sed 's/%/%25/g')
                echo "::error::$escaped"
              done

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ZhishengWeather.xcodeproj \
            -scheme ZhishengWeather \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZhishengWeather.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ZhishengWeather.xcarchive/Products/Applications/ZhishengWeather.app build/Payload/
          cd build && zip -r ZhishengWeather-unsigned.ipa Payload
          ls -lh ZhishengWeather-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZhishengWeather-unsigned-ipa
          path: build/ZhishengWeather-unsigned.ipa
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/*.xcresult
          if-no-files-found: ignore
